<section class="coche-hero{{clase_hero}}">
  <div class="coche-hero-foto">{{silueta}}</div>
  <div class="coche-hero-velo" aria-hidden="true"></div>
  <div class="contenedor coche-hero-texto">
    <p class="etiqueta"><a href="../index.html#personas" style="text-decoration:none;color:inherit">&larr; El club</a></p>
    <h1>{{marca}} <em>{{modelo}}</em></h1>
    <div class="filete"></div>
    <p class="subtitulo">{{subtitulo}}</p>
{{resumen}}
  </div>
</section>
<!--sec:detalle-->
<section class="seccion">
  <div class="contenedor" style="display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))">
<!--sec:descripcion-->
    <div class="texto" data-anim="izq-difumina">
      <h2>El <em>coche</em></h2>
{{descripcion}}
    </div>
<!--/sec:descripcion-->
<!--sec:ficha-->
    <div data-anim="izq-difumina" style="--d:.25s">
      <h2>Ficha</h2>
      <dl class="ficha">
{{ficha}}
      </dl>
    </div>
<!--/sec:ficha-->
  </div>
</section>
<!--/sec:detalle-->
<!--sec:galeria-->
<section class="seccion alt">
  <div class="contenedor">
    <h2>Galería</h2>
    <div class="galeria">
{{galeria}}
    </div>
  </div>
</section>
<!--/sec:galeria-->
<!--sec:eventos-->
<section class="seccion">
  <div class="contenedor" data-anim="difumina">
    <h2>Dónde <em>verlo</em></h2>
{{eventos}}
  </div>
</section>
<!--/sec:eventos-->
