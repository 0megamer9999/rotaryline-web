<section class="cab-pagina rayado">
  <div class="contenedor">
    <p class="etiqueta">Ven a vernos</p>
    <h1><em>EVENTOS</em></h1>
    <div class="filete"></div>
    <p class="texto">Quién va a cada evento, con qué coche y si estará en la expo.</p>
  </div>
</section>
<!--sec:lista-->
<section class="seccion">
  <div class="contenedor">
    <div class="filtros" role="group" aria-label="Filtrar por coche">
{{chips}}
      <label><input type="checkbox" id="solo-proximos"> Solo los próximos</label>
    </div>
    <div id="lista-eventos">
{{eventos}}
    </div>
    <p id="sin-eventos" class="texto" hidden>No hay eventos con ese filtro.</p>
  </div>
</section>
<!--/sec:lista-->
<!--sec:proximamente-->
<section class="seccion">
  <div class="contenedor" style="text-align:center">
    <img src="img/eventos-proximamente.svg" alt="Un BMW E39 y un Mazda RX-8 de ruta hacia un evento" width="420" height="420" style="width:min(420px,90%);height:auto;display:block;margin:0 auto">
    <p class="etiqueta">Eventos · Próximamente</p>
    <p class="texto" style="margin:0 auto">Estamos cuadrando el calendario. Mientras tanto, estos dos ya van de camino.</p>
  </div>
</section>
<!--/sec:proximamente-->
